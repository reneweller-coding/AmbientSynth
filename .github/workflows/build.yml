# Every push builds and measures. The first job is the one that has to stay fast: the core, the
# render tool and the self test, without JUCE, on both a Windows and a Linux compiler -- two
# compilers disagree about more than one ever will. The second job builds the plugin and runs the
# host-contract test, which needs JUCE and therefore costs a few minutes.
name: build

on:
  push:
    branches: [master]
    # A day of work on the library is thirty pushes, and most of them cannot break a build: prose,
    # generated preset packs, the sample lists. Those do not need a compiler, and a mailbox full of
    # notifications about them is a mailbox nobody reads.
    paths-ignore:
      - 'docs/**'
      - 'Library/**'
      - 'Tools/library/prompts/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

# One run per branch. Pushing again while a run is going cancels it rather than queueing a second:
# what matters is whether the tip builds, not whether every intermediate commit did.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core and self test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DAMBIENT_BUILD_PLUGIN=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Self test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Render a preset offline
        shell: bash
        run: |
          # The name has to be exact. A wildcard on 'ambient_render*' also matches what MSBuild
          # leaves beside the binary -- ambient_render.exe.recipe, .iobj, .ipdb, .tlog -- and the
          # recipe sorts first, so this step spent two days handing an XML file to bash and
          # reporting "syntax error near unexpected token" from a job called "render a preset".
          # Linux never saw it: there are no such files there, which is why only Windows was red.
          bin=$(find build -type f \( -name ambient_render -o -name ambient_render.exe \) | head -1)
          if [ -z "$bin" ]; then
            echo "::error::ambient_render was not built -- nothing to render with"
            find build -type f -name 'ambient_render*' | head -20
            exit 1
          fi
          echo "rendering with $bin"
          "$bin" --preset "Sleep Concert" --seconds 8 --notes 45,52,59 --measure

  plugin:
    name: plugin and host contract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # JUCE is fetched by CMake; caching it turns a two-minute download into a few seconds.
      - name: Cache JUCE
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Self test and host contract
        run: ctest --test-dir build -C Release --output-on-failure
